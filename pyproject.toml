[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-tracer"
version = "0.1.0"
description = "Lightweight cost, latency and quality tracing for LLM calls, with a local dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Revanth Tatineni" }]
keywords = ["llm", "observability", "tracing", "monitoring", "llmops", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "pandas>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
llm-cost-tracer = "llm_cost_tracer.cli:main"

[project.urls]
Homepage = "https://github.com/Revanth-Tatineni/llm-cost-tracer"
Repository = "https://github.com/Revanth-Tatineni/llm-cost-tracer"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_tracer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/llm_cost_tracer"]
